<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" fill="none">
  <defs>
    <linearGradient id="bgOrb1" x1="60" y1="40" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kidneyFill" x1="120" y1="70" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="kidneyRim" x1="110" y1="60" x2="370" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="250" y1="120" x2="560" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.24"/>
    </pattern>
  </defs>

  <!-- Subtle lab coordinate backdrop -->
  <rect x="16" y="16" width="608" height="388" rx="28" fill="url(#bgOrb1)"/>
  <rect x="28" y="28" width="584" height="364" rx="22" fill="url(#dotGrid)"/>
  <circle cx="220" cy="215" r="145" fill="#2563eb" fill-opacity="0.08"/>
  <circle cx="470" cy="195" r="120" fill="#14b8a6" fill-opacity="0.10"/>

  <!-- Stylized Kidney Silhouette -->
  <path d="M214 68C144 68 98 122 98 198c0 58 29 112 78 144 25 16 54 22 77 15 22-7 33-28 24-52-6-17-22-25-31-43-10-20-5-46 12-59 19-14 48-13 66-31 19-19 22-49 5-74-20-29-62-40-115-40z"
        fill="url(#kidneyFill)" fill-opacity="0.92" stroke="url(#kidneyRim)" stroke-width="2.5"/>
  <!-- Renal hilum / nephron loops -->
  <path d="M188 122c-30 12-49 42-49 77 0 38 22 70 53 86" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M204 148c-19 10-30 29-30 51 0 23 12 44 32 54" stroke="#99f6e4" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <!-- Glomerular tuft + tubule path -->
  <circle cx="195" cy="188" r="18" fill="#0b1f3a" fill-opacity="0.28" stroke="#ffffff" stroke-width="2"/>
  <path d="M184 188c4-8 14-8 18 0s-8 10-14 4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M213 188c14 0 22 14 34 18s28-4 40 8" stroke="#ccfbf1" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Drug-Gene Knowledge Graph Edges -->
  <g stroke="url(#edgeGrad)" stroke-width="2" stroke-opacity="0.72">
    <line x1="286" y1="214" x2="380" y2="128"/>
    <line x1="286" y1="214" x2="405" y2="210"/>
    <line x1="286" y1="214" x2="380" y2="296"/>
    <line x1="380" y1="128" x2="494" y2="108"/>
    <line x1="380" y1="128" x2="492" y2="204"/>
    <line x1="405" y1="210" x2="492" y2="204"/>
    <line x1="405" y1="210" x2="510" y2="302"/>
    <line x1="380" y1="296" x2="510" y2="302"/>
  </g>

  <!-- Molecular Hexagon #1 (Top Right) -->
  <g transform="translate(494, 108)">
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/>
    <polygon points="0,-21 18,-10 18,10 0,21 -18,10 -18,-10" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="0" cy="-32" r="4" fill="#2563eb"/>
    <circle cx="28" cy="16" r="4" fill="#14b8a6"/>
    <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ECFP4</text>
  </g>

  <!-- Molecular Hexagon #2 (Middle Right) -->
  <g transform="translate(492, 204)">
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="#ffffff" stroke="#14b8a6" stroke-width="2.4"/>
    <circle cx="-22" cy="0" r="3.5" fill="#2563eb"/>
    <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">K-PRL</text>
  </g>

  <!-- Safety Guardrail Hexagon (Bottom Right) -->
  <g transform="translate(510, 302)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#0f172a" stroke="#14b8a6" stroke-width="2.2"/>
    <text x="0" y="4" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, monospace" font-size="10" font-weight="700">T-DIKI</text>
  </g>

  <!-- Pathway / Target Nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">
    <rect x="342" y="112" width="76" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="380" y="131" text-anchor="middle" fill="#1e3a8a">TGFBR1</text>

    <rect x="366" y="195" width="78" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="405" y="214" text-anchor="middle" fill="#0f766e">SMAD3</text>

    <rect x="344" y="281" width="72" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="380" y="300" text-anchor="middle" fill="#1d4ed8">PPARA</text>
  </g>

  <!-- Hub Node -->
  <circle cx="286" cy="214" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="286" cy="214" r="4.5" fill="#14b8a6"/>

  <!-- Floating Status Chips -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">
    <rect x="44" y="38" width="168" height="30" rx="15" fill="#ffffff" fill-opacity="0.94" stroke="#dbeafe" stroke-width="1.2"/>
    <circle cx="60" cy="53" r="4.5" fill="#10b981"/>
    <text x="72" y="57" fill="#0f172a">21,299 LINCS Compounds</text>

    <rect x="44" y="346" width="184" height="30" rx="15" fill="#ffffff" fill-opacity="0.94" stroke="#ccfbf1" stroke-width="1.2"/>
    <circle cx="60" cy="361" r="4.5" fill="#2563eb"/>
    <text x="72" y="365" fill="#0f172a">Deterministic SOP Agent</text>
  </g>
</svg>

# BM-2 cohort registry (Stage 2, pre-registered 2026-11-20).
#
# QC rules are fixed BEFORE evaluation and applied to every cohort added after
# the original six:
#   1) disease group and control group each with n >= 5 samples
#   2) >= 8000 genes successfully mapped into the 12,328-gene L1000 universe
#   3) biological positive-control check: LN cohorts must show IFN-I top
#      up-regulation; DKD/fibrosis cohorts must show ECM/TGFb up-regulation or
#      tubular metabolic down-regulation (recorded in the ETL log, not tuned).
# Cohorts from the same study carry the same study_id for study-level
# deduplicated sensitivity tests.
#
# data_format: series_matrix (default) | rnaseq_processed_csv | rnaseq_tar_txt
# The ETL (scripts/etl/bm2_cohort_deg.py) reads this file as its source of
# truth; group rules are regexes matched against joined sample metadata tags.

qc:
  min_group_n: 5
  min_mapped_genes: 8000
  require_positive_control: true

cohorts:
  # ---- original six (grandfathered group sizes, still QC-checked) ----
  DKD_glom:
    gse: GSE30528
    study_id: GSE30528
    disease: DKD
    compartment: glomerulus
    disease_re: "diabetic kidney disease"
    control_re: "control"
    note: "DKD glomeruli vs control glomeruli (Human U133A 2.0)"
  DKD_tub:
    gse: GSE30529
    study_id: GSE30529
    disease: DKD
    compartment: tubulointerstitium
    disease_re: "diabetic kidney disease"
    control_re: "control"
    note: "DKD tubuli vs control tubuli"
  LN_glom:
    gse: GSE32591
    study_id: GSE32591
    disease: LN
    compartment: glomerulus
    disease_re: "LN patient"
    control_re: "control"
    any_re: "Glomeruli"
    note: "LN glomeruli vs control glomeruli (HuGene ST)"
  LN_tub:
    gse: GSE32591
    study_id: GSE32591
    disease: LN
    compartment: tubulointerstitium
    disease_re: "LN patient"
    control_re: "control"
    any_re: "Tubulointerstitium"
    note: "LN tubulointerstitium vs control"
  CKD:
    gse: GSE66494
    study_id: GSE66494
    disease: CKD
    compartment: whole_kidney
    disease_re: "chronic kidney disease"
    control_re: "normal kidney"
    note: "CKD biopsies vs normal kidney RNA (Agilent)"
  LN2:
    gse: GSE112943
    study_id: GSE112943
    disease: LN
    compartment: whole_kidney
    disease_re: "lupus nephritis"
    control_re: "Kidney Control"
    note: "LN kidney vs normal kidney (HT-12 V4)"
  AKI:
    gse: GSE30718
    study_id: GSE30718
    disease: AKI
    compartment: whole_kidney
    disease_re: "Acute kidney injury"
    control_re: "pristine protocol biopsy"
    note: "transplant-AKI vs pristine protocol biopsies"

  # ---- Stage 2 additions: ERCB (European Renal cDNA Bank) ----
  ERCB_DKD_glom:
    gse: GSE104948
    matrix_file: GPL22945.txt.gz
    platform: GPL22945
    study_id: ERCB

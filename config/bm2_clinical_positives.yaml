# BM-2 Tier-A clinical positive truth table (pre-registered 2026-11-20).
#
# These are guideline / high-evidence nephro-protective drugs per disease.
# They are FROZEN before the Stage-2 evaluation runs; BM-2 maps each name to
# the in-library pert_id(s) and reports availability. No name is added or
# removed after seeing results. Tier-B (Repurposing Hub indication keyword
# matching, used earlier) is kept only as a transparent sensitivity analysis.
#
# refs: short pointer to the pivotal trial/guideline for the indication.

tier_a:
